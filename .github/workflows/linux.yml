name: Linux

# No paths-ignore: a skipped workflow never reports its checks, so required checks would block docs-only PRs.
# The `changes` job decides instead, and `linux-status` always reports the result.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their superseded runs; every push to main gets its own group and runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pull requests check out the merge commit, whose first parent is the base branch.
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: ./scripts/ci-changes.sh "$BASE" HEAD | tee -a "$GITHUB_OUTPUT"

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check shell script modes
        run: |
          bad=$(git ls-files -s -- '*.sh' | grep -v -e '^100755 ' -e $'\tscripts/linux-env.sh$' || true)
          if [ -n "$bad" ]; then
            echo "Skrypty bez trybu 100755 (git update-index --chmod=+x):"
            echo "$bad"
            exit 1
          fi
      - name: Test CI and PR hygiene scripts
        run: |
          ./scripts/test-ci-changes.sh
          ./scripts/test-pr-hygiene.sh
          ./scripts/test-check-architecture.sh
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check C++ formatting
        run: CLANG_FORMAT=clang-format-18 ./scripts/format.sh --check

  # Layer rules and size budgets (scripts/check_architecture.py): source text only, no build, runs on every change.
  # Pull requests also compare the allowlist and budgets with the base branch, so neither can be raised in the PR,
  # unless the owner has set the `architecture-debt-approved` label (then rerun the job).
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check layers and budgets
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request'
            && !contains(github.event.pull_request.labels.*.name, 'architecture-debt-approved')
            && format('origin/{0}', github.base_ref) || '' }}
        run: python3 scripts/check_architecture.py ${BASE:+--base "$BASE"}

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      SDL_VIDEO_DRIVER: x11
    steps:
      - uses: actions/checkout@v7
      - name: Install build and graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config ccache \
            libgl-dev libegl-dev libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev \
            libpulse-dev libudev-dev libdbus-1-dev libdrm-dev libgbm-dev xvfb xauth
      - name: Restore pinned dependency archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/strefa-deps
          key: strefa-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      # Pull requests only restore the newest main cache; main saves it after the build (below).
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-main-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.job }}-main-
      - name: Build and test CPU contracts
        run: |
          ccache --zero-stats
          ./scripts/build.sh --test-suite cpu --jobs "$(nproc)" --junit-dir build/junit \
            --dependency-cache ~/.cache/strefa-deps
          ccache --show-stats
      # The Release build links with LTO, which inlines and drops symbols; count them in a build without IPO.
      - name: Count QA symbols in StrefaZero (no IPO)
        run: |
          cmake -S . -B build/noipo -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTREFA_WARNINGS_AS_ERRORS=ON             -DSTREFA_IPO=OFF -DSTREFA_DOWNLOAD_CACHE="$HOME/.cache/strefa-deps"
          cmake --build build/noipo --target strefa_zero --parallel "$(nproc)"
          python3 scripts/check_architecture.py --symbols build/noipo/StrefaZero
      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-main-${{ github.sha }}
      # STREFA_REQUIRE_GL43=1: a GPU test without OpenGL 4.3 fails (exit 1) instead of being skipped (77).
      - name: Test windows and compute shaders with Mesa
        env:
          STREFA_REQUIRE_GL43: "1"
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' \
            ctest --test-dir build/linux-release --output-on-failure -L '^ci-smoke$' \
            --output-junit "$PWD/build/junit/smoke.xml"
          MESA_GL_VERSION_OVERRIDE=3.3 MESA_GLSL_VERSION_OVERRIDE=330 \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            ctest --test-dir build/linux-release --output-on-failure -L '^ci-gl33$' \
            --output-junit "$PWD/build/junit/gl33.xml"
      # Any other skip (e.g. gpu.shader_cache without program binaries) must not leave the job green either.
      - name: Require no skipped window tests
        run: python3 scripts/junit-summary.py --fail-on-skipped 'Mesa' build/junit/{smoke,gl33}.xml
      - name: Test summary
        if: always()
        run: python3 scripts/junit-summary.py 'Linux (Release)' build/junit/{cpu,smoke,gl33}.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Package Linux runtime
        run: ./scripts/package-linux.sh
      - name: Verify relocated runtime
        run: |
          mkdir -p /tmp/strefa-bundle
          tar -xzf dist/StrefaZero-Linux-x86_64.tar.gz -C /tmp/strefa-bundle
          cd /tmp/strefa-bundle/StrefaZero-Linux-x86_64
          sha256sum -c SHA256SUMS.txt
          env -u LD_LIBRARY_PATH xvfb-run -a ./StrefaZero --smoke-test --profile /tmp/strefa-installed-profile
          ./StrefaPhysics --scene chain --ticks 5 --output /tmp/strefa-installed-physics
      - uses: actions/upload-artifact@v7
        with:
          name: StrefaZero-Linux-x86_64
          path: dist/StrefaZero-Linux-x86_64.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Linux-test-logs
          path: |
            build/junit/
            build/linux-release/Testing/Temporary/
            build/linux-release/*profile/*.txt

  core-only:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build ccache
      # Pull requests only restore the newest main cache; main saves it after the build (below).
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-main-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.job }}-main-
      - name: Build and test without SDL/OpenGL
        run: |
          ccache --zero-stats
          ./scripts/build.sh --core-only --test-suite cpu --jobs "$(nproc)" --junit-dir build/junit
          ccache --show-stats
      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-main-${{ github.sha }}
      - name: Test summary
        if: always()
        run: python3 scripts/junit-summary.py 'Linux (core-only)' build/junit/cpu.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Linux-core-only-test-logs
          path: |
            build/junit/
            build/linux-release-core/Testing/Temporary/

  # Core-only variants: sanitizers, a TSan subset (full TSan runs nightly), Clang + libc++ and GCC Debug.
  # Debug builds keep assert() and other NDEBUG-dependent paths that the Release jobs never compile.
  core-variants:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: sanitizers
            configuration: RelWithDebInfo
            cmake: -DSTREFA_SANITIZE=address,undefined
          - job: tsan
            configuration: RelWithDebInfo
            cmake: -DSTREFA_SANITIZE=thread
            tests: -R '^sim\.(numerics_parallel|laboratory_worker|golden_master)$'
          # Debug keeps NDEBUG undefined; -O2 instead of -O0 keeps golden_master within
          # its time limit (at -O0 it needs 85% of it on an 8-core desktop).
          # libc++ 18 ships std::jthread/std::stop_token only with -fexperimental-library.
          - job: clang
            configuration: Debug
            packages: clang-18 libc++-18-dev libc++abi-18-dev
            cmake: >-
              -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_FLAGS_DEBUG='-g -O2'
              -DCMAKE_CXX_FLAGS='-stdlib=libc++ -fexperimental-library'
              -DCMAKE_EXE_LINKER_FLAGS='-stdlib=libc++ -fexperimental-library'
          - job: gcc-debug
            configuration: Debug
            cmake: -DCMAKE_CXX_FLAGS_DEBUG='-g -O2'
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build ccache ${{ matrix.packages }}
      # ASan/TSan shadow memory fails with the 32-bit mmap randomization of the runner kernel.
      - name: Limit mmap randomization for sanitizers
        if: contains(matrix.cmake, 'STREFA_SANITIZE')
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      # Pull requests only restore the newest main cache; main saves it after the build (below).
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.job }}-main-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.job }}-main-
      - name: Build without SDL/OpenGL
        run: |
          ccache --zero-stats
          ./scripts/build.sh --core-only --configuration ${{ matrix.configuration }} --skip-tests \
            --jobs "$(nproc)" --build-dir build/ci -- ${{ matrix.cmake }}
          ccache --show-stats
      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.job }}-main-${{ github.sha }}
      - name: Run CPU tests
        env:
          ASAN_OPTIONS: ${{ contains(matrix.cmake, 'address') && 'detect_leaks=1:detect_stack_use_after_return=1' || '' }}
          UBSAN_OPTIONS: ${{ contains(matrix.cmake, 'undefined') && 'print_stacktrace=1' || '' }}
        run: |
          mkdir -p build/junit
          ctest --test-dir build/ci --output-on-failure --parallel "$(nproc)" -LE graphics \
            --output-junit "$PWD/build/junit/cpu.xml" ${{ matrix.tests }}
      - name: Test summary
        if: always()
        run: python3 scripts/junit-summary.py 'Linux (${{ matrix.job }})' build/junit/cpu.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Linux-${{ matrix.job }}-test-logs
          path: |
            build/junit/
            build/ci/Testing/Temporary/

  # The single check to require in the ruleset: green when every job passed or was skipped as docs-only.
  linux-status:
    if: always()
    needs: [changes, format, architecture, build-and-test, core-only, core-variants]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Zmiany w kodzie: ${CODE:-?}; wyniki jobów: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
