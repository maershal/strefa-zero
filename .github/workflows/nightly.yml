name: Nightly

# Full ThreadSanitizer run of every CPU test (~24 min CPU); pull requests run only the TSan subset in linux.yml.
# Not a required check: a failed scheduled run opens or updates the issue labelled `nightly`
# (scripts/nightly-issue.sh); a manual run does so only with report_issue.
on:
  schedule:
    # Off the full hour, when scheduled runs queue longest; nightly-gpu.yml starts 30 min later.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      report_issue:
        description: 'Open or update the `nightly` issue when a test fails'
        type: boolean
        default: false

permissions:
  contents: read

# One run per branch at a time; a queued run waits instead of cancelling the one that is running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  tsan-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build ccache
      # TSan shadow memory fails with the 32-bit mmap randomization of the runner kernel.
      - name: Limit mmap randomization for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-tsan-full-${{ github.sha }}
          restore-keys: |
            ccache-tsan-full-
            ccache-tsan-main-
      - name: Build and run every CPU test under TSan
        run: |
          ccache --zero-stats
          ./scripts/build.sh --core-only --configuration RelWithDebInfo --test-suite cpu --jobs "$(nproc)" \
            --build-dir build/tsan --junit-dir build/junit -- -DSTREFA_SANITIZE=thread
          ccache --show-stats
      - name: Test summary
        if: always()
        run: |
          mkdir -p build/junit
          python3 scripts/junit-summary.py 'Linux (TSan, pełny)' build/junit/cpu.xml \
            | tee build/junit/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-tsan-summary
          retention-days: 14
          path: build/junit/summary.md
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Linux-tsan-full-test-logs
          path: |
            build/junit/
            build/tsan/Testing/Temporary/

  report:
    needs: tsan-full
    if: >-
      always() && needs.tsan-full.result != 'success' && needs.tsan-full.result != 'skipped'
      && (github.event_name == 'schedule' || inputs.report_issue)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      # A cancelled or timed-out job may leave no summary: the issue then names the job result instead.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: nightly-tsan-summary
          path: build/junit
      - name: Open or update the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/nightly-issue.sh --title 'Nocny przebieg TSan: niezaliczone testy CPU' --run-name TSan \
            --summary build/junit/summary.md \
            --fallback 'Brak podsumowania JUnit (tsan-full: ${{ needs.tsan-full.result }}).' \
            --artifacts-note '(raporty JUnit, logi CTest)' --skip-artifact nightly-tsan-summary
