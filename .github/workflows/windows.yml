name: Windows

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Build with MSVC (warnings as errors)
        run: ./scripts/build.ps1 -Configuration Release -SkipTests
      # The runner has no OpenGL 4.3 context, so only the CPU suite runs (same filter as build.sh --test-suite cpu).
      # sim.golden_master is excluded until its MSVC hash mismatch (also on main, GCC reference) is resolved.
      - name: Test CPU contracts
        run: ctest --test-dir build/release --output-on-failure -LE graphics -E '^sim\.golden_master$'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Windows-test-logs
          path: build/release/Testing/Temporary/
