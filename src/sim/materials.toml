# Material registry of the CPU model (sim::Material). The order of the [[material]] tables is the material ID:
# append new materials at the end (IDs are stored in recordings and index the thermal shader tables) and add
# the id to PINNED_IDS in scripts/gen_materials.py.
# After a change: python3 scripts/gen_materials.py (writes src/sim/material_tables.hpp and
# assets/shaders/materials.glsl).
# Units: normalized mass/volume, enthalpy in kJ per unit mass, temperatures in K; conductance is accelerated
# for game-scale time. `name` and `description` are UI strings and stay in Polish.
#
# particle_materials: CPU-model material of each GPU particle material, in the order of gpu::Material
# (erase, sand, ash, metal, wall, water, oil).
# [[transition]] (after the materials): phase change from `from` into `to` at `temperature` with latent heat
# `latent`. It defines the enthalpy offset of `to`: offset(from) + (c_from - c_to) * temperature + latent.
# A material with `enthalpy_offset_of` uses the offset of the named material instead.
particle_materials = ["empty", "sand", "ash", "metal", "stone", "water", "oil"]

