# Rejestr materiałów modelu CPU (sim::Material). Kolejność tabel [[material]] to ID materiału:
# nowe materiały dopisuj na końcu, bo ID są zapisane w nagraniach i w tablicach shaderów termiki.
# Po zmianie: python3 scripts/gen_materials.py (generuje src/sim/material_tables.hpp).
# Jednostki: znormalizowana masa/objętość, entalpia w kJ na jednostkę masy, temperatury w K;
# przewodność jest przyspieszona do skali czasu gry.

